name: Build Rishe v2 package

on:
  push:
    branches:
      - main
      - agent/rishe-v2-workflows
      - agent/fix-warehouse-and-buttons
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install production autoloader
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Resolve plugin version
        id: version
        shell: bash
        run: |
          version=$(php -r '$source=file_get_contents("rishe.php"); preg_match("/Version:\\s*([0-9.]+)/", $source, $match); echo $match[1] ?? "unknown";')
          test "$version" != "unknown"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate changed PHP files
        run: |
          php -l rishe.php
          php -l src/Plugin.php
          php -l src/Infrastructure/WordPress/AdminMenu.php
          php -l src/Infrastructure/WordPress/BusinessAdminPage.php
          php -l src/Infrastructure/WordPress/BusinessDialogCompatibility.php
          php -l src/Infrastructure/WordPress/BusinessRestApi.php
          php -l src/Infrastructure/WordPress/Capabilities.php
          php -l src/Infrastructure/WordPress/DefaultWarehouseProvisioner.php

      - name: Validate admin JavaScript
        run: node --check assets/admin/business.js

      - name: Build installable ZIP
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          mkdir -p build/rishe
          rsync -a ./ build/rishe/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'tests' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'composer.lock'
          cd build
          zip -qr "rishe-${version}.zip" rishe

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: rishe-${{ steps.version.outputs.version }}
          path: build/rishe-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
